<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CivicEvents</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

  <main id="app" class="max-w-6xl mx-auto p-4">
        <section id="page-login" class="page max-w-md mx-auto bg-white p-6 rounded shadow mt-10">
      <h1 class="text-2xl font-bold mb-4">Log in</h1>
      <p id="loginError" class="hidden text-red-800 bg-red-50 p-2 rounded mb-3" role="alert"></p>

      <form id="loginForm" novalidate>
        <label for="login-email" class="block font-medium">Email</label>
        <input id="login-email" type="email" autocomplete="email" class="w-full border rounded p-2 mb-3" />

        <label for="login-password" class="block font-medium">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" class="w-full border rounded p-2 mb-3" />

        <label class="flex items-center gap-2 mb-4 text-sm">
          <input id="remember" type="checkbox" /> Remember me on this device
        </label>

        <button type="submit" id="loginBtn" class="w-full bg-blue-700 text-white py-2 rounded hover:bg-blue-800 disabled:opacity-60">Log in</button>
      </form>

      <p class="mt-4 text-sm">No account? <a href="#/signup" class="text-blue-700 underline">Sign up</a></p>
    </section>

        <section id="page-signup" class="page max-w-md mx-auto bg-white p-6 rounded shadow mt-10">
      <h1 class="text-2xl font-bold mb-4">Create an account</h1>
      <p id="signupError" class="hidden text-red-800 bg-red-50 p-2 rounded mb-3" role="alert"></p>

      <form id="signupForm" novalidate>
        <label for="signup-name" class="block font-medium">Full name</label>
        <input id="signup-name" type="text" autocomplete="name" class="w-full border rounded p-2 mb-3" />

        <label for="signup-email" class="block font-medium">Email</label>
        <input id="signup-email" type="email" autocomplete="email" class="w-full border rounded p-2 mb-3" />

        <label for="signup-password" class="block font-medium">Password</label>
        <input id="signup-password" type="password" autocomplete="new-password" class="w-full border rounded p-2 mb-2" />

        <div class="h-2 bg-gray-200 rounded mb-1">
          <div id="strengthBar" class="h-2 rounded w-0"></div>
        </div>
        <p id="strengthText" class="text-sm mb-1" aria-live="polite"></p>
        <p class="text-sm text-gray-700 mb-3">At least 8 characters with uppercase, lowercase, a number and a special character.</p>

        <label for="signup-confirm" class="block font-medium">Confirm password</label>
        <input id="signup-confirm" type="password" autocomplete="new-password" class="w-full border rounded p-2 mb-4" />

        <button type="submit" id="signupBtn" class="w-full bg-blue-700 text-white py-2 rounded hover:bg-blue-800 disabled:opacity-60">Sign up</button>
      </form>

      <p class="mt-4 text-sm">Already have an account? <a href="#/login" class="text-blue-700 underline">Log in</a></p>
    </section>

    <section id="page-events" class="page">
      <h1 class="text-2xl font-bold mb-2">Events</h1>
      <p id="welcome" class="mb-4"></p>
      <button id="logoutBtn" type="button" class="bg-gray-800 text-white px-3 py-1.5 rounded">Log out</button>
    </section>

  </main>

  <script src="main.js"></script>
</body>
</html>
